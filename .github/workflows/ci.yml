name: CI

# The gates only protect the codebase if they run without anyone remembering
# to run them: 392 tests including the localization coverage gate (missing
# es/pt strings fail the build) and the Doctor/recipe data invariants.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin the image: macos-latest rolls its Swift toolchain, which poisons a
    # restored .build (prebuilt swift-syntax macros are compiler-version-locked
    # → "module compiled with Swift X cannot be imported by Y").
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "v=$(swift --version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          # Key on the exact toolchain too — a Swift upgrade must not restore
          # macro binaries the new compiler can't read.
          key: spm-${{ runner.os }}-${{ steps.swift.outputs.v }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.swift.outputs.v }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
